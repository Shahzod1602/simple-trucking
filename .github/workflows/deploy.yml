name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: GH_PAT
          script_stop: true
          script: |
            set -e
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
            cd /opt/simple-trucking
            if [ -n "$GH_PAT" ]; then
              git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/Shahzod1602/simple-trucking.git"
            else
              git remote set-url origin git@github.com:Shahzod1602/simple-trucking.git
            fi
            git pull origin main
            ATTEMPT=1
            MAX_ATTEMPTS=3
            until [ "$ATTEMPT" -gt "$MAX_ATTEMPTS" ]; do
              echo "Deploy attempt $ATTEMPT/$MAX_ATTEMPTS"
              docker compose down --remove-orphans || true
              PORT_8002_PIDS="$(lsof -ti tcp:8002 || true)"
              if [ -n "$PORT_8002_PIDS" ]; then
                for pid in $PORT_8002_PIDS; do
                  CMD="$(ps -p "$pid" -o args= || true)"
                  if echo "$CMD" | grep -Eq "uvicorn|/opt/simple-trucking|ratecon"; then
                    echo "Stopping conflicting process on 8002: pid=$pid cmd=$CMD"
                    kill -9 "$pid" || true
                  else
                    echo "Port 8002 in use by non-project process, skipping: pid=$pid cmd=$CMD"
                  fi
                done
              fi

              if docker compose up --build -d; then
                break
              fi

              if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
                echo "Port 8002 status:"
                ss -ltnp | grep ':8002' || true
                docker ps --format "table {{.Names}}\t{{.Ports}}" || true
                echo "Deploy failed after $MAX_ATTEMPTS attempts"
                exit 1
              fi
              ATTEMPT=$((ATTEMPT + 1))
              sleep 2
            done
            docker image prune -f