# REQUIRES: add SERVER_SSH_KEY secret (ed25519 private key) whose public key is in the
# server's authorized_keys; you may then disable PasswordAuthentication. Until the secret
# is added, deploys will fail.
name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/simple-trucking
            PREV_COMMIT="$(git rev-parse HEAD || true)"
            # Pull over SSH using the repo's read-only deploy key.
            # ~/.ssh/config defines the `github-simpletrucking` alias →
            # HostName github.com + IdentityFile ~/.ssh/github_simpletrucking.
            # (No PAT: avoids token-expiry breaking deploys.)
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true
            git remote set-url origin git@github-simpletrucking:Shahzod1602/simple-trucking.git
            echo "=== Pulling latest code ==="
            git pull origin main
            echo "=== Pull successful ==="
            ATTEMPT=1
            MAX_ATTEMPTS=3
            until [ "$ATTEMPT" -gt "$MAX_ATTEMPTS" ]; do
              echo "Deploy attempt $ATTEMPT/$MAX_ATTEMPTS"
              docker compose down --remove-orphans || true
              PORT_8002_PIDS="$(lsof -ti tcp:8002 || true)"
              if [ -n "$PORT_8002_PIDS" ]; then
                for pid in $PORT_8002_PIDS; do
                  CMD="$(ps -p "$pid" -o args= || true)"
                  if echo "$CMD" | grep -Eq "uvicorn|/opt/simple-trucking|ratecon"; then
                    echo "Stopping conflicting process on 8002: pid=$pid cmd=$CMD"
                    kill -9 "$pid" || true
                  else
                    echo "Port 8002 in use by non-project process, skipping: pid=$pid cmd=$CMD"
                  fi
                done
              fi

              if docker compose up --build -d; then
                break
              fi

              if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
                echo "Port 8002 status:"
                ss -ltnp | grep ':8002' || true
                docker ps --format "table {{.Names}}\t{{.Ports}}" || true
                echo "Deploy failed after $MAX_ATTEMPTS attempts"
                exit 1
              fi
              ATTEMPT=$((ATTEMPT + 1))
              sleep 2
            done
            echo "=== Smoke test: /api/health ==="
            OK=0
            for i in $(seq 1 20); do
              CODE="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8002/api/health || true)"
              if [ "$CODE" = "200" ]; then OK=1; echo "health OK"; break; fi
              sleep 3
            done
            if [ "$OK" != "1" ]; then
              echo "Smoke test FAILED — rolling back to $PREV_COMMIT"
              if [ -n "$PREV_COMMIT" ]; then
                git reset --hard "$PREV_COMMIT"
                docker compose up --build -d || true
              fi
              exit 1
            fi
            docker image prune -f