services:
  db:
    image: postgres:16-alpine
    container_name: ratecon_db
    restart: always
    environment:
      POSTGRES_USER: ratecon
      # No insecure default — must be provided via .env (deploy fails fast otherwise).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ratecon
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "effective_cache_size=1GB"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratecon"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ratecon_app
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ratecon:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/ratecon
    ports:
      - "8002:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # App is healthy only when /api/health returns 200 (DB reachable).
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health',timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 25s
    dns:
      - 8.8.8.8
      - 8.8.4.4

volumes:
  pgdata:
    external: true
    name: simpletrucking_pgdata
