# SimpleTrucking — HTTP vhost (TLS terminated here once certs exist, or upstream by a
# central proxy). For direct TLS on this box, run certbot then switch to
# nginx-tls.conf.example (full 443 + HSTS + redirect).
server {
    listen 80;
    server_name simpletrucking.online;

    client_max_body_size 50M;

    # Let's Encrypt HTTP-01 challenge (for certbot --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Baseline security headers (kept here so they apply even before TLS).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    # CSP: the SPA relies on inline event handlers, so script-src keeps 'unsafe-inline'
    # (a strict policy would break the app). The real XSS defense is sink-escaping in the
    # HTML templates; this header is defense-in-depth (object/base/frame-ancestors locked).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-src 'self' blob:; frame-ancestors 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
