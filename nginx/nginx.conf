# waymark — HTTP vhost (TLS terminated here once certs exist, or upstream by a
# central proxy). For direct TLS on this box, run certbot then switch to
# nginx-tls.conf.example (full 443 + HSTS + redirect).
server {
    listen 80;
    server_name simpletrucking.identify.uz;

    client_max_body_size 50M;

    # Let's Encrypt HTTP-01 challenge (for certbot --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Baseline security headers (kept here so they apply even before TLS).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
