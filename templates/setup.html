<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SimpleTrucking — Sign In</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #4f7cff;
      --primary-hover: #3a64e8;
      --primary-light: #eff4ff;
      --success: #16a34a;
      --error: #dc2626;
      --error-light: #fef2f2;
    }
    [data-theme="dark"] {
      --bg: #0d1117; --card: #161b22;
      --text: #e6edf3; --text-muted: #8b949e;
      --border: #30363d; --primary-light: rgba(79,124,255,0.12);
      --error-light: rgba(220,38,38,0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 16px;
      transition: background 0.2s, color 0.2s;
    }

    .logo {
      display: flex; align-items: center; gap: 10px; margin-bottom: 28px;
      text-decoration: none;
    }
    .logo-icon {
      width: 36px; height: 36px; background: var(--primary);
      border-radius: 10px; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0;
    }
    .logo-text { font-size: 1rem; font-weight: 800; color: var(--text); }

    .card {
      background: var(--card); border-radius: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.06);
      width: 100%; max-width: 400px;
      border: 1px solid var(--border); overflow: hidden;
    }

    .tab-bar { display: flex; border-bottom: 1px solid var(--border); }
    .tab-btn {
      flex: 1; padding: 14px; border: none; background: none;
      font-size: 0.88rem; font-weight: 600; color: var(--text-muted);
      cursor: pointer; transition: all 0.15s;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab-btn:hover:not(.active) { color: var(--text); }

    .form-body { padding: 28px; }

    .field { margin-bottom: 14px; }
    .field label {
      display: block; font-size: 0.8rem; font-weight: 600;
      color: var(--text-muted); margin-bottom: 6px;
    }
    .field input {
      width: 100%; padding: 10px 13px;
      border: 1.5px solid var(--border); border-radius: 9px;
      font-size: 0.92rem; color: var(--text);
      background: var(--bg); outline: none; transition: border-color 0.15s;
      font-family: inherit;
    }
    .field input:focus { border-color: var(--primary); }

    .err-banner {
      background: var(--error-light); border: 1px solid rgba(220,38,38,0.2);
      border-radius: 8px; padding: 10px 13px;
      color: var(--error); font-size: 0.84rem; margin-bottom: 14px; display: none;
    }

    .btn-submit {
      width: 100%; padding: 12px; margin-top: 4px;
      background: var(--primary); color: #fff; border: none;
      border-radius: 9px; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-submit:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }

    .form-footer {
      text-align: center; margin-top: 16px;
      font-size: 0.82rem; color: var(--text-muted);
    }
    .form-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .form-footer a:hover { text-decoration: underline; }

    .theme-btn {
      position: fixed; top: 16px; right: 16px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 12px; cursor: pointer;
      font-size: 0.82rem; color: var(--text-muted); transition: all 0.15s;
    }
    .theme-btn:hover { border-color: var(--primary); color: var(--primary); }

    .panel { display: none; }
    .panel.active { display: block; animation: fadeUp 0.2s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>

  <button class="theme-btn" id="theme-btn">🌙</button>

  <a class="logo" href="/">
    <div class="logo-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
    </div>
    <div class="logo-text">SimpleTrucking</div>
  </a>

  <div class="card">
    <div class="form-body">
      <div id="panel-login">
        <div class="err-banner" id="login-err"></div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="l-email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="l-pass" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button class="btn-submit" id="login-btn">Sign In</button>
      </div>
    </div>
  </div>

  <script>
    // ── Theme ─────────────────────────────────────────────────────────────
    let isDark = localStorage.getItem('st_theme') !== 'light';
    function applyTheme() {
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      document.getElementById('theme-btn').textContent = isDark ? '☀️' : '🌙';
    }
    applyTheme();
    document.getElementById('theme-btn').addEventListener('click', () => {
      isDark = !isDark;
      localStorage.setItem('st_theme', isDark ? 'dark' : 'light');
      applyTheme();
    });

    if (localStorage.getItem('st_token')) window.location.href = '/app';

    function showErr(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg; el.style.display = 'block';
    }

    // ── Login ─────────────────────────────────────────────────────────────
    async function doLogin() {
      const email = document.getElementById('l-email').value.trim();
      const pass  = document.getElementById('l-pass').value;
      if (!email || !pass) { showErr('login-err', 'Please enter your email and password'); return; }

      const btn = document.getElementById('login-btn');
      btn.disabled = true; btn.textContent = 'Signing in...';

      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password: pass }),
        });
        const data = await r.json();
        if (!r.ok) { showErr('login-err', data.detail || 'Invalid email or password'); return; }
        localStorage.setItem('st_token', data.token);
        localStorage.setItem('st_name', data.name);
        window.location.href = '/app';
      } catch {
        showErr('login-err', 'Connection error. Please try again.');
      } finally {
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    }

    document.getElementById('login-btn').addEventListener('click', doLogin);
    document.getElementById('l-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
