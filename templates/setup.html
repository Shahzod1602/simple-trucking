<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SimpleTrucking — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090f;
      --card: #0c1020;
      --text: #bec9e0;
      --text-muted: #3d5070;
      --border: rgba(255,255,255,0.08);
      --primary: #4585ff;
      --primary-hover: #3368e0;
      --primary-light: rgba(69,133,255,0.1);
      --error: #ef4444;
      --error-light: rgba(239,68,68,0.1);
    }
    [data-theme="light"] {
      --bg: #edf1f8; --card: #fff;
      --text: #0e1828; --text-muted: #64748b; --border: #dce2ef;
      --primary: #3b72ff; --primary-hover: #2b5ce0; --primary-light: rgba(59,114,255,0.08);
      --error: #dc2626; --error-light: #fef2f2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 16px;
      transition: background 0.2s, color 0.2s;
      background-image: radial-gradient(circle, rgba(69,133,255,0.04) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .logo {
      display: flex; align-items: center; gap: 10px; margin-bottom: 28px;
      text-decoration: none;
    }
    .logo-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, #4585ff, #2563eb);
      border-radius: 8px; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0;
      overflow: hidden; box-shadow: 0 0 16px rgba(69,133,255,0.3);
    }
    .logo-icon img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .logo-text {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.15rem; font-weight: 700; color: var(--text);
      letter-spacing: 0.5px; text-transform: uppercase;
    }

    .card {
      background: var(--card); border-radius: 12px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 24px 60px rgba(0,0,0,0.4);
      width: 100%; max-width: 400px;
      border: 1px solid var(--border); overflow: hidden;
      position: relative;
    }
    .card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, rgba(69,133,255,0.5), transparent 60%);
    }

    .tab-bar { display: flex; border-bottom: 1px solid var(--border); }
    .tab-btn {
      flex: 1; padding: 13px; border: none; background: none;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 0.86rem; font-weight: 600; color: var(--text-muted);
      cursor: pointer; transition: all 0.15s;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab-btn:hover:not(.active) { color: var(--text); }

    .form-body { padding: 26px; }

    .field { margin-bottom: 13px; }
    .field label {
      display: block; font-size: 0.75rem; font-weight: 600;
      color: var(--text-muted); margin-bottom: 5px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .field input {
      width: 100%; padding: 9px 12px;
      border: 1px solid var(--border); border-radius: 8px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 0.92rem; color: var(--text);
      background: rgba(255,255,255,0.03); outline: none; transition: border-color 0.15s;
    }
    .field input:focus { border-color: var(--primary); }

    .err-banner {
      background: var(--error-light); border: 1px solid rgba(220,38,38,0.2);
      border-radius: 6px; padding: 9px 12px;
      color: var(--error); font-size: 0.83rem; margin-bottom: 13px; display: none;
    }

    .btn-submit {
      width: 100%; padding: 11px; margin-top: 4px;
      background: var(--primary); color: #fff; border: none;
      border-radius: 8px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 0.92rem; font-weight: 700;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-submit:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-submit:disabled { background: rgba(255,255,255,0.1); color: var(--text-muted); cursor: not-allowed; }

    .form-footer {
      text-align: center; margin-top: 16px;
      font-size: 0.82rem; color: var(--text-muted);
    }
    .form-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .form-footer a:hover { text-decoration: underline; }

    .theme-btn {
      position: fixed; top: 16px; right: 16px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 7px; padding: 6px 12px; cursor: pointer;
      font-size: 0.8rem; color: var(--text-muted); transition: all 0.15s;
    }
    .theme-btn:hover { border-color: var(--primary); color: var(--primary); }

    .panel { display: none; }
    .panel.active { display: block; animation: fadeUp 0.2s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>

  <button class="theme-btn" id="theme-btn">🌙</button>

  <a class="logo" href="/">
    <div class="logo-icon">
      <img src="/static/logo.svg" alt="SimpleTrucking logo" />
    </div>
    <div class="logo-text">SimpleTrucking</div>
  </a>

  <div class="card">
    <div class="form-body">
      <div id="panel-login">
        <div class="err-banner" id="login-err"></div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="l-email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="l-pass" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button class="btn-submit" id="login-btn">Sign In</button>
      </div>
    </div>
  </div>

  <script>
    // ── Theme ─────────────────────────────────────────────────────────────
    let isDark = localStorage.getItem('st_theme') !== 'light';
    function applyTheme() {
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      document.getElementById('theme-btn').textContent = isDark ? '☀️' : '🌙';
    }
    applyTheme();
    document.getElementById('theme-btn').addEventListener('click', () => {
      isDark = !isDark;
      localStorage.setItem('st_theme', isDark ? 'dark' : 'light');
      applyTheme();
    });

    if (localStorage.getItem('st_token')) window.location.href = '/app';

    function showErr(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg; el.style.display = 'block';
    }

    // ── Login ─────────────────────────────────────────────────────────────
    async function doLogin() {
      const email = document.getElementById('l-email').value.trim();
      const pass  = document.getElementById('l-pass').value;
      if (!email || !pass) { showErr('login-err', 'Please enter your email and password'); return; }

      const btn = document.getElementById('login-btn');
      btn.disabled = true; btn.textContent = 'Signing in...';

      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password: pass }),
        });
        const data = await r.json();
        if (!r.ok) { showErr('login-err', data.detail || 'Invalid email or password'); return; }
        localStorage.setItem('st_token', data.token);
        localStorage.setItem('st_name', data.name);
        window.location.href = '/app';
      } catch {
        showErr('login-err', 'Connection error. Please try again.');
      } finally {
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    }

    document.getElementById('login-btn').addEventListener('click', doLogin);
    document.getElementById('l-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
